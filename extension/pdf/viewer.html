<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>LivePage</title>
    <link rel="stylesheet" href="../vendor/pdfjs/pdf_viewer.css" />
    <link rel="stylesheet" href="../content/content.css" />
    <link rel="stylesheet" href="./viewer.css" />
  </head>
  <body>
    <header class="bar">
      <span class="mark">LivePage</span>
      <h1 id="title">Opening…</h1>
      <span class="where" id="where"></span>
      <div class="tools">
        <button type="button" id="zoom-out" title="Zoom out">−</button>
        <button type="button" id="zoom-in" title="Zoom in">+</button>
        <button type="button" id="source" title="Open the original PDF">Original</button>
        <button type="button" id="dashboard">Dashboard</button>
      </div>
    </header>

    <div id="viewerContainer"><div id="viewer" class="pdfViewer"></div></div>

    <p class="notice" id="notice" hidden></p>

    <script type="module" src="./viewer.js"></script>
  </body>
</html>
