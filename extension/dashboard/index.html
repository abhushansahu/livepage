<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Cache-Control" content="no-cache" />
    <title>LivePage</title>
    <link rel="stylesheet" href="./dashboard.css" />
  </head>
  <body>
    <div class="app">
      <aside class="side">
        <p class="mark">LivePage</p>
        <h1 id="heading">For you</h1>
        <p class="lede">
          What you meant to come back to, tagged so you can find it later. Surfaces you do not want can stay off.
        </p>
        <p class="side-label">Rooms</p>
        <nav id="nav"></nav>
        <p class="side-label" id="tag-label" hidden>Tags</p>
        <div class="tag-bar" id="tag-bar"></div>
        <p class="side-label">Tools</p>
        <div class="side-actions">
          <button class="solid" id="sync-saves">Refresh from this Chrome</button>
          <button class="ghost" id="sync-rss">Sync RSS</button>
          <button class="ghost" id="bind-vault">Bind vault folder</button>
          <button class="ghost" id="write-vault">Write vault</button>
          <button class="ghost" id="export-waiting">Dump waiting</button>
          <a class="ghost" href="../options/options.html">Settings</a>
        </div>
        <p class="experiment" id="experiment-note"></p>
      </aside>
      <main>
        <header class="home-top" id="home-top" hidden>
          <button type="button" class="home-mark" id="home-mark">LivePage</button>
          <label class="home-search">
            <svg class="ico" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
            <input id="home-search" type="search" placeholder="Search, or #tag" autocomplete="off" />
            <kbd>⌘K</kbd>
          </label>
          <div class="home-more">
            <button type="button" class="home-icon" id="home-more" aria-label="More" aria-expanded="false">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
            </button>
            <div class="home-menu" id="home-menu" hidden role="menu"></div>
          </div>
          <a class="home-icon" href="../options/options.html" aria-label="Settings" title="Settings">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
          </a>
        </header>
        <header class="top">
          <label class="search-wrap">
            <svg class="ico" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
            <input id="search" type="search" placeholder="Search, or #tag" />
          </label>
          <div class="search-mode" id="search-mode" hidden role="group" aria-label="What to search">
            <button type="button" data-mode="pages" class="is-on">Pages</button>
            <button type="button" data-mode="passages">Passages</button>
          </div>
          <select id="sort" aria-label="Sort">
            <option value="recent">Recent</option>
            <option value="oldest-unread">Oldest unread</option>
            <option value="never-opened">Never opened</option>
            <option value="bookmarked">Bookmarked first</option>
            <option value="title">Title</option>
          </select>
          <div class="counts" id="counts"></div>
        </header>
        <div id="view"></div>
      </main>
      <aside class="rail" id="rail" hidden></aside>
      <article id="drawer" class="drawer" hidden></article>
    </div>
    <script type="module" src="./dashboard.js"></script>
  </body>
</html>
