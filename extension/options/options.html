<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>LivePage settings</title>
    <link rel="stylesheet" href="./options.css" />
  </head>
  <body>
    <main>
      <p class="mark">LivePage</p>
      <h1>Habitat</h1>
      <form id="form">
        <label>Default highlight
          <select name="defaultColor">
            <option value="lemon">Lemon</option>
            <option value="moss">Moss</option>
            <option value="sky">Sky</option>
            <option value="rose">Rose</option>
            <option value="iris">Iris</option>
            <option value="sand">Sand</option>
          </select>
        </label>
        <label>Default agent
          <select name="agentDefault">
            <option value="cursor">Cursor Agent</option>
            <option value="claude-code">Claude Code</option>
          </select>
        </label>
        <label>Obsidian vault name
          <input name="obsidianVault" placeholder="optional" />
        </label>
        <label>Obsidian folder
          <input name="obsidianFolder" placeholder="LivePage" />
        </label>
        <label class="check">
          <input type="checkbox" name="remindersEnabled" />
          Daily push for pages still waiting
        </label>
        <label>Reminder hour
          <input type="number" min="0" max="23" name="reminderHour" />
        </label>
        <label class="check">
          <input type="checkbox" name="lockInfiniteScroll" />
          Disallow highlighting on infinite-scrolling pages until snapshot
        </label>
        <label class="check">
          <input type="checkbox" name="importSavesEnabled" />
          Pull X bookmarks, Reddit saved, YouTube Watch Later, and similar lists
        </label>
        <label class="check">
          <input type="checkbox" name="localTweetsEnabled" />
          Local AI observations in the For you feed
        </label>
        <button type="submit">Save</button>
        <p id="status" hidden>Saved.</p>
      </form>
    </main>
    <script type="module" src="./options.js"></script>
  </body>
</html>
